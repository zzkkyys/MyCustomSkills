<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>

<style>
:root{
  --backdrop:#DFE2E6;
  --sheet:#FFFFFF;
  --sheet-edge:#C7CDD4;
  --bar:#F4F6F8;
  --ink:#14181D;
  --ink-2:#4A525C;
  --ink-3:#7B8590;
  --rule:#DCE0E5;
  --accent:#1E4B8F;

  --add-fg:#123D7A;
  --add-bg:#DBE7F9;
  --add-edge:#8FB4E4;

  --del-fg:#8E2436;
  --del-bg:#F7DEE2;
  --del-edge:#D79AA6;

  --mod-fg:#75470A;
  --mod-bg:#FAEACD;
  --mod-edge:#DCB776;

  --mov-fg:#4E3F80;
  --mov-bg:#E7E2F6;
  --mov-edge:#B0A3DC;

  --serif:Charter,"Iowan Old Style","Palatino Linotype",Palatino,"Sitka Text",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;

  --dock-w:392px;
}

@media (prefers-color-scheme:dark){
  :root{
    --backdrop:#0E1114; --sheet:#191D23; --sheet-edge:#2B323A; --bar:#141920;
    --ink:#E7EAEE; --ink-2:#A9B3BE; --ink-3:#7B8590; --rule:#2C333B; --accent:#7FAEEC;
    --add-fg:#A6CAF7; --add-bg:#16304F; --add-edge:#3C6499;
    --del-fg:#F0A6B2; --del-bg:#47202A; --del-edge:#8A4753;
    --mod-fg:#EAC282; --mod-bg:#42330F; --mod-edge:#8A6E32;
    --mov-fg:#C7B9F0; --mov-bg:#2C2650; --mov-edge:#5F5195;
  }
}
:root[data-theme="dark"]{
  --backdrop:#0E1114; --sheet:#191D23; --sheet-edge:#2B323A; --bar:#141920;
  --ink:#E7EAEE; --ink-2:#A9B3BE; --ink-3:#7B8590; --rule:#2C333B; --accent:#7FAEEC;
  --add-fg:#A6CAF7; --add-bg:#16304F; --add-edge:#3C6499;
  --del-fg:#F0A6B2; --del-bg:#47202A; --del-edge:#8A4753;
  --mod-fg:#EAC282; --mod-bg:#42330F; --mod-edge:#8A6E32;
  --mov-fg:#C7B9F0; --mov-bg:#2C2650; --mov-edge:#5F5195;
}
:root[data-theme="light"]{
  --backdrop:#DFE2E6; --sheet:#FFFFFF; --sheet-edge:#C7CDD4; --bar:#F4F6F8;
  --ink:#14181D; --ink-2:#4A525C; --ink-3:#7B8590; --rule:#DCE0E5; --accent:#1E4B8F;
  --add-fg:#123D7A; --add-bg:#DBE7F9; --add-edge:#8FB4E4;
  --del-fg:#8E2436; --del-bg:#F7DEE2; --del-edge:#D79AA6;
  --mod-fg:#75470A; --mod-bg:#FAEACD; --mod-edge:#DCB776;
  --mov-fg:#4E3F80; --mov-bg:#E7E2F6; --mov-edge:#B0A3DC;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--backdrop);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}

/* ---------- top bar ---------- */
.bar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb,var(--bar) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.bar-in{
  display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap;
  padding:.7rem 1.5rem;
}
.brand{display:flex; align-items:baseline; gap:.6rem; margin-right:auto}
.brand-t{font-size:.9rem; font-weight:650; letter-spacing:.01em}
.brand-s{font-size:.75rem; color:var(--ink-3); font-family:var(--mono)}

.seg{display:flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden; background:var(--sheet)}
.seg button{
  font:inherit; font-size:.75rem; padding:.3rem .7rem; border:0;
  background:transparent; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

.prog{font-size:.75rem; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.prog b{color:var(--ink); font-weight:650}

/* ---------- legend ---------- */
.legend{
  display:flex; gap:1.1rem; flex-wrap:wrap; align-items:center;
  padding:.45rem 1.5rem; border-bottom:1px solid var(--rule);
  background:var(--sheet); font-size:.72rem; color:var(--ink-2);
}
.lg{display:inline-flex; align-items:center; gap:.4rem}
.sw{display:inline-block; padding:0 .3em; border-radius:2px; font-family:var(--serif); font-size:.8rem}
.sw.a{background:var(--add-bg); color:var(--add-fg); box-shadow:inset 0 -1px 0 var(--add-edge)}
.sw.d{background:var(--del-bg); color:var(--del-fg); text-decoration:line-through; box-shadow:inset 0 -1px 0 var(--del-edge)}
.sw.m{background:var(--mod-bg); color:var(--mod-fg); box-shadow:inset 0 -1px 0 var(--mod-edge)}
.sw.v{background:var(--mov-bg); color:var(--mov-fg); box-shadow:inset 0 -1px 0 var(--mov-edge)}
.legend .hint{margin-left:auto; color:var(--ink-3)}

/* ---------- shell ---------- */
.shell{
  display:grid; grid-template-columns:minmax(0,1fr) var(--dock-w);
  gap:1.75rem; align-items:start;
  padding:1.75rem 1.5rem 5rem;
  max-width:1500px; margin:0 auto;
}

/* ---------- sheet ---------- */
.sheet{
  background:var(--sheet);
  border:1px solid var(--sheet-edge);
  border-radius:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -18px rgba(0,0,0,.3);
  padding:3rem 3.25rem 3.5rem;
  min-width:0;
}
.doc-head{border-bottom:1px solid var(--rule); padding-bottom:1.5rem; margin-bottom:2.25rem}
.doc-head h1{
  font-family:var(--serif); font-weight:600; font-size:1.6rem; line-height:1.25;
  margin:0 0 .5rem; text-wrap:balance; letter-spacing:-.005em;
}
.doc-head p,.doc-head .intro{margin:0; font-size:.83rem; line-height:1.65; color:var(--ink-2); max-width:46em}
.doc-head .intro.spaced{margin-top:.6rem}
.stats{display:flex; gap:1.5rem; flex-wrap:wrap; margin-top:1.15rem}
.stat{display:flex; align-items:baseline; gap:.4rem}
.stat b{font-size:1.3rem; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat span{font-size:.72rem; color:var(--ink-3)}
.stat.crit b{color:var(--del-fg)}

section{margin-bottom:2.75rem}
.sec-head{
  display:flex; align-items:baseline; gap:.65rem; flex-wrap:wrap;
  margin-bottom:1rem; padding-bottom:.45rem; border-bottom:1px solid var(--rule);
}
.sec-head h2{margin:0; font-size:.78rem; font-weight:650; letter-spacing:.09em; text-transform:uppercase}
.loc{font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.sec-note{margin-left:auto; font-size:.7rem; color:var(--ink-3)}

.prose{
  font-family:var(--serif);
  font-size:1.02rem; line-height:1.85; color:var(--ink);
  max-width:37em; margin:0 0 1.1rem;
  text-align:justify; hyphens:auto;
}
.prose:last-child{margin-bottom:0}
.snip{font-size:.72rem; color:var(--ink-3); font-family:var(--sans); font-style:normal}

/* ---------- change marks ---------- */
.chg{cursor:pointer; border-radius:2px}
.chg:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.chg del,.chg ins{text-decoration:none; padding:.06em .1em; border-radius:2px}
.chg del{
  text-decoration:line-through; text-decoration-thickness:1.5px;
  text-decoration-color:color-mix(in srgb,var(--del-fg) 70%,transparent);
  background:var(--del-bg); color:var(--del-fg); box-shadow:inset 0 -1px 0 var(--del-edge);
}
.chg ins{background:var(--add-bg); color:var(--add-fg); box-shadow:inset 0 -1px 0 var(--add-edge)}
.chg[data-type="修改"] ins{background:var(--mod-bg); color:var(--mod-fg); box-shadow:inset 0 -1px 0 var(--mod-edge)}
.chg[data-type="结构"] del,.chg[data-type="结构"] ins{
  background:var(--mov-bg); color:var(--mov-fg); box-shadow:inset 0 -1px 0 var(--mov-edge);
}

.mk{
  display:inline-block; vertical-align:super;
  font-family:var(--mono); font-size:.58em; font-weight:600; line-height:1;
  padding:.18em .3em; margin-left:.1em; border-radius:2px;
  background:var(--ink-3); color:var(--sheet);
  font-variant-numeric:tabular-nums; user-select:none;
}
.chg.is-blocker .mk{background:var(--del-fg)}
.chg.done .mk{background:transparent; color:var(--ink-3); box-shadow:inset 0 0 0 1px var(--rule)}
.chg.sel del,.chg.sel ins{box-shadow:inset 0 0 0 1.5px currentColor}
.chg.sel .mk{outline:2px solid var(--accent); outline-offset:1px}

.chg.done del,.chg.done ins{opacity:.42}

/* paragraph-break mark */
.brk{
  display:block; text-align:center; margin:.6rem 0 1.1rem;
  font-family:var(--serif); cursor:pointer;
}
.brk ins{font-size:1rem; letter-spacing:.2em}

/* view: final */
:root[data-view="final"] .chg del{display:none}
:root[data-view="final"] .chg ins{
  background:transparent; box-shadow:none; color:inherit;
  border-bottom:1px dotted var(--ink-3);
}
:root[data-view="final"] .chg.sel ins{background:var(--add-bg); color:var(--add-fg)}

/* filter: blockers only */
:root[data-filter="crit"] .chg:not(.is-blocker) del,
:root[data-filter="crit"] .chg:not(.is-blocker) ins{
  background:transparent; box-shadow:none; color:var(--ink-3); text-decoration:none;
}
:root[data-filter="crit"] .chg:not(.is-blocker) del{display:none}
:root[data-filter="crit"] .chg:not(.is-blocker) .mk{opacity:.28}
:root[data-filter="crit"] .chg.sel del,
:root[data-filter="crit"] .chg.sel ins{
  background:var(--add-bg); color:var(--add-fg);
  box-shadow:inset 0 0 0 1.5px currentColor;
}

/* ---------- dock ---------- */
.dock{
  position:sticky; top:6.5rem;
  background:var(--sheet); border:1px solid var(--sheet-edge); border-radius:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -18px rgba(0,0,0,.3);
  max-height:calc(100vh - 8.5rem); display:flex; flex-direction:column; overflow:hidden;
}
.dock-head{
  display:flex; align-items:center; gap:.5rem;
  padding:.7rem .95rem; border-bottom:1px solid var(--rule);
}
.dock-title{font-size:.72rem; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2)}
.nav{margin-left:auto; display:flex; align-items:center; gap:.35rem}
.nav span{font-size:.72rem; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:3.4em; text-align:right}
.iconbtn{
  width:1.65rem; height:1.65rem; border:1px solid var(--rule); border-radius:4px;
  background:transparent; color:var(--ink-2); cursor:pointer; font-size:.8rem; line-height:1;
  display:grid; place-items:center; padding:0;
}
.iconbtn:hover{background:var(--bar); color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.dock-body{padding:1.1rem .95rem 1.25rem; overflow-y:auto}

.empty{color:var(--ink-3); font-size:.8rem; line-height:1.8}
.empty strong{display:block; color:var(--ink-2); font-size:.85rem; margin-bottom:.5rem; font-weight:600}
.empty kbd{
  font-family:var(--mono); font-size:.72em; padding:.1em .35em;
  border:1px solid var(--rule); border-radius:3px; color:var(--ink-2);
}

.chips{display:flex; gap:.35rem; flex-wrap:wrap; margin-bottom:.7rem}
.chip{
  font-size:.68rem; font-weight:600; padding:.18rem .45rem; border-radius:3px;
  letter-spacing:.02em; border:1px solid transparent;
}
.chip.sev-必改{background:var(--del-bg); color:var(--del-fg); border-color:var(--del-edge)}
.chip.sev-建议{background:var(--add-bg); color:var(--add-fg); border-color:var(--add-edge)}
.chip.sev-润色{background:transparent; color:var(--ink-3); border-color:var(--rule)}
.chip.cat{background:transparent; color:var(--ink-2); border-color:var(--rule); font-weight:500}
.chip.loc{background:transparent; color:var(--ink-3); border-color:var(--rule); font-family:var(--mono); font-weight:500}
.chip.src-both{background:var(--mov-bg); color:var(--mov-fg); border-color:var(--mov-edge)}
.chip.src-second{background:transparent; color:var(--ink-2); border-color:var(--ink-3)}
.chip.src-mine{background:transparent; color:var(--ink-3); border-color:var(--rule); font-weight:500}

.lab{
  font-size:.66rem; font-weight:650; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin:1.05rem 0 .35rem;
}
.chips + .lab{margin-top:0}
.quote{
  font-family:var(--mono); font-size:.755rem; line-height:1.75;
  padding:.55rem .7rem; border-radius:0 3px 3px 0; overflow-x:auto;
  white-space:pre-wrap; word-break:break-word;
}
.quote.before{background:var(--del-bg); color:var(--del-fg); border-left:2.5px solid var(--del-edge)}
.quote.after{background:var(--add-bg); color:var(--add-fg); border-left:2.5px solid var(--add-edge)}
.quote.none{background:transparent; color:var(--ink-3); border-left:2.5px solid var(--rule); font-style:italic; font-family:var(--sans)}
.why{font-size:.82rem; line-height:1.85; color:var(--ink-2); margin:0}
.why em{color:var(--ink); font-style:normal; font-weight:600}
.why{overflow-x:auto}
.why table{border-collapse:collapse; width:100%; margin:.6rem 0; font-size:.76rem}
.why th,.why td{border:1px solid var(--rule); padding:.35rem .45rem; text-align:left}

.done-btn{
  margin-top:1.25rem; width:100%; font:inherit; font-size:.78rem; font-weight:600;
  padding:.5rem; border-radius:4px; border:1px solid var(--rule);
  background:transparent; color:var(--ink-2); cursor:pointer;
}
.done-btn:hover{background:var(--bar); color:var(--ink)}
.done-btn[data-on="1"]{background:var(--accent); border-color:var(--accent); color:#fff}
.done-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.closebtn{display:none}

@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr); padding:1.25rem .9rem 4rem; gap:1.25rem}
  .sheet{padding:1.9rem 1.35rem 2.25rem}
  .prose{text-align:left; hyphens:none}
  .dock{
    position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60;
    max-height:68vh; border-radius:10px 10px 0 0; border-bottom:0;
    transform:translateY(101%); transition:transform .22s ease;
    box-shadow:0 -8px 40px -12px rgba(0,0,0,.45);
  }
  body.has-sel .dock{transform:translateY(0)}
  body.has-sel .shell{padding-bottom:calc(68vh + 4rem)}
  .chg{scroll-margin-top:7rem; scroll-margin-bottom:70vh}
  .closebtn{display:grid}
  .bar-in{padding:.6rem .9rem}
  .legend{padding:.45rem .9rem}
  .legend .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="brand-t">@@BRAND@@</span>
      <span class="brand-s">@@LOC@@</span>
    </div>
    <div class="seg" role="group" aria-label="视图">
      <button id="v-mark" aria-pressed="true">标记视图</button>
      <button id="v-final" aria-pressed="false">终稿视图</button>
    </div>
    <div class="seg" role="group" aria-label="筛选">
      <button id="f-all" aria-pressed="true">全部</button>
      <button id="f-crit" aria-pressed="false">突出必改</button>
    </div>
    <div class="prog">已处理 <b id="pdone">0</b> / <span id="ptotal">0</span></div>
    <button class="iconbtn" id="theme" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
  </div>
  <div class="legend">
    <span class="lg"><span class="sw a">新增</span> 补写的内容</span>
    <span class="lg"><span class="sw d">删除</span> 建议删掉</span>
    <span class="lg"><span class="sw m">改写</span> 措辞／语法修正</span>
    <span class="lg"><span class="sw v">结构</span> 拆段与调序</span>
    <span class="hint">点击任意标记查看理由 · ← → 逐条浏览 · Esc 关闭</span>
  </div>
</header>

<div class="shell">
<main class="sheet">
@@BODY@@
</main>

<aside class="dock" id="dock" aria-label="修改说明">
  <div class="dock-head">
    <span class="dock-title" id="dock-title">修改说明</span>
    <div class="nav">
      <span id="navcount"></span>
      <button class="iconbtn" id="prev" title="上一处 (←)" aria-label="上一处">←</button>
      <button class="iconbtn" id="next" title="下一处 (→)" aria-label="下一处">→</button>
      <button class="iconbtn closebtn" id="close" title="关闭 (Esc)" aria-label="关闭">✕</button>
    </div>
  </div>
  <div class="dock-body" id="dock-body" aria-live="polite"></div>
</aside>
</div>

<script>
@@DATA@@
/* ---------- init ---------- */
const root=document.documentElement, body=document.body;
const spans=[...document.querySelectorAll('.chg')];
const order=[]; const byId=Object.create(null);

spans.forEach(sp=>{
  const id=sp.dataset.id, d=DATA[id];
  if(!d){ console.warn('no data for',id); return; }
  if(!byId[id]){ byId[id]=[]; order.push(id); }
  byId[id].push(sp);
  sp.dataset.type=d.type;
  if(d.sev==='必改') sp.classList.add('is-blocker');
  sp.setAttribute('role','button');
  sp.setAttribute('tabindex','0');
  sp.setAttribute('aria-label',`${d.type}：${d.cat}，${d.sev}`);
});

order.forEach((id,i)=>{
  byId[id].forEach(sp=>{
    const b=document.createElement('b');
    b.className='mk'; b.textContent=String(i+1);
    sp.appendChild(b);
  });
});

const total=order.length;
const count=s=>order.filter(id=>DATA[id].sev===s).length;
document.getElementById('s-total').textContent=total;
document.getElementById('s-crit').textContent=count('必改');
document.getElementById('s-sug').textContent=count('建议');
document.getElementById('s-pol').textContent=count('润色');
document.getElementById('ptotal').textContent=total;

/* ---------- done state ---------- */
const KEY='@@KEY@@-done';
let done=new Set();
try{ done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]')); }catch(e){}
function saveDone(){ try{ localStorage.setItem(KEY,JSON.stringify([...done])); }catch(e){} }
function paintDone(){
  order.forEach(id=>byId[id].forEach(sp=>sp.classList.toggle('done',done.has(id))));
  document.getElementById('pdone').textContent=[...done].filter(id=>byId[id]).length;
}

/* ---------- dock ---------- */
const dockBody=document.getElementById('dock-body');
const navCount=document.getElementById('navcount');
let cur=null;

const SRC={both:'双方共识',second:'第二意见提出',mine:'本轮提出'};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(id){
  const d=DATA[id]; if(!d) return;
  cur=id;
  spans.forEach(sp=>sp.classList.toggle('sel',sp.dataset.id===id));
  navCount.textContent=`${order.indexOf(id)+1} / ${total}`;
  const isAdd=d.before.startsWith('（原文无此内容）');
  dockBody.innerHTML=`
    <div class="chips">
      <span class="chip sev-${d.sev}">${d.sev}</span>
      <span class="chip cat">${esc(d.type)} · ${esc(d.cat)}</span>
      <span class="chip loc">${esc(d.loc)}</span>
      <span class="chip src-${d.src||'mine'}">${SRC[d.src||'mine']}</span>
    </div>
    <div class="lab">原文</div>
    <div class="quote ${isAdd?'none':'before'}">${esc(d.before)}</div>
    <div class="lab">改为</div>
    <div class="quote after">${esc(d.after)}</div>
    <div class="lab">为什么改</div>
    <div class="why">${d.why}</div>
    <button class="done-btn" id="donebtn" data-on="${done.has(id)?1:0}">${done.has(id)?'✓ 已处理（点击撤销）':'标记为已处理'}</button>`;
  document.getElementById('donebtn').addEventListener('click',()=>{
    done.has(id)?done.delete(id):done.add(id);
    saveDone(); paintDone(); render(id);
    document.getElementById('donebtn')?.focus();
  });
  dockBody.scrollTop=0;
  body.classList.add('has-sel');
}

function clearSel(){
  cur=null; body.classList.remove('has-sel');
  spans.forEach(sp=>sp.classList.remove('sel'));
  navCount.textContent='';
  dockBody.innerHTML=`<div class="empty"><strong>点击稿件中任意标记</strong>
    这里会显示该处的原文、改后文本，以及具体的修改理由。<br><br>
    红色编号为<strong>必改项</strong>（语法错误、前后矛盾、占位符残留等投稿前必须处理的问题）；
    灰色编号为建议与润色项。<br><br>
    <kbd>←</kbd> <kbd>→</kbd> 逐条浏览　<kbd>Esc</kbd> 关闭</div>`;
}

function step(delta){
  if(!total) return;
  const i=cur?order.indexOf(cur):-1;
  const n=((i+delta)%total+total)%total;
  const id=order[n];
  render(id);
  byId[id][0].scrollIntoView({block:'center',behavior:'smooth'});
}

spans.forEach(sp=>{
  sp.addEventListener('click',e=>{e.stopPropagation(); render(sp.dataset.id);});
  sp.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault(); render(sp.dataset.id);}
  });
});
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
document.getElementById('close').addEventListener('click',clearSel);

document.addEventListener('keydown',e=>{
  const t=e.target instanceof Element ? e.target : null;
  if(t&&t.closest('button,input,textarea,select,a,[contenteditable="true"]')&&e.key!=='Escape') return;
  if(e.key==='Escape') clearSel();
  else if(e.key==='ArrowRight') {e.preventDefault(); step(1);}
  else if(e.key==='ArrowLeft')  {e.preventDefault(); step(-1);}
});

/* ---------- toggles ---------- */
function pair(aId,bId,fn){
  const a=document.getElementById(aId), b=document.getElementById(bId);
  a.addEventListener('click',()=>{a.setAttribute('aria-pressed','true');b.setAttribute('aria-pressed','false');fn(0);});
  b.addEventListener('click',()=>{b.setAttribute('aria-pressed','true');a.setAttribute('aria-pressed','false');fn(1);});
}
pair('v-mark','v-final',v=>root.setAttribute('data-view',v?'final':'mark'));
pair('f-all','f-crit',v=>root.setAttribute('data-filter',v?'crit':'all'));

root.setAttribute('data-view','mark');
root.setAttribute('data-filter','all');
paintDone();
clearSel();

/* ---------- theme (local build) ---------- */
const TKEY='@@KEY@@-theme';
const mq=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(t){
  if(t==='dark'||t==='light') root.setAttribute('data-theme',t);
  else root.removeAttribute('data-theme');
  const dark = root.getAttribute('data-theme')==='dark' ||
               (!root.hasAttribute('data-theme') && mq.matches);
  const b=document.getElementById('theme');
  if(b){ b.setAttribute('aria-pressed', String(dark));
         b.setAttribute('aria-label', dark?'切换到亮色主题':'切换到暗色主题'); }
}
let theme=null;
try{ theme=localStorage.getItem(TKEY); }catch(e){}
applyTheme(theme);
document.getElementById('theme').addEventListener('click',()=>{
  const isDark = root.getAttribute('data-theme')==='dark' ||
                 (!root.hasAttribute('data-theme') && mq.matches);
  theme = isDark ? 'light' : 'dark';
  applyTheme(theme);
  try{ localStorage.setItem(TKEY,theme); }catch(e){}
});

</script>
