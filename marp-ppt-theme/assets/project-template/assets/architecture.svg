<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">模型架构示意图</title>
  <desc id="desc">输入经过编码、推理和输出三个阶段。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f9fbff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#516b9f"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="60" y="170" width="180" height="150" rx="18" fill="#143b7e"/>
    <text x="150" y="238" fill="#fff" font-size="30" font-weight="700">输入</text>
    <text x="150" y="278" fill="#dbe8ff" font-size="20">数据与特征</text>
    <rect x="310" y="135" width="180" height="220" rx="18" fill="#0c5c4c"/>
    <text x="400" y="230" fill="#fff" font-size="30" font-weight="700">模型</text>
    <text x="400" y="270" fill="#d8f5ec" font-size="20">编码 · 推理</text>
    <rect x="560" y="170" width="180" height="150" rx="18" fill="#8f1023"/>
    <text x="650" y="238" fill="#fff" font-size="30" font-weight="700">输出</text>
    <text x="650" y="278" fill="#ffe4e8" font-size="20">结果与评价</text>
  </g>
  <path d="M240 245 H300" stroke="#516b9f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M490 245 H550" stroke="#516b9f" stroke-width="8" marker-end="url(#arrow)"/>
</svg>
